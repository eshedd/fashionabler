<!DOCTYPE html>
<html>
<head>
    <title>Select Your Clothing</title>
    <style>
        body { font-family: Arial; background-color: #f5f5f5; padding: 20px; }
        h1 { text-align: center; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            justify-items: center;
            margin-top: 20px;
        }

        .clothing-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            width: 200px;
            position: relative;
        }

        .clothing-item img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }

        .clothing-item form {
            margin-top: 8px;
            width: 100%;
            text-align: center;
        }

        .clothing-item button {
            margin-bottom: 8px;
            padding: 10px 40px;
            font-size: 0.9em;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .clothing-item button:hover {
            background-color: #0056b3;
        }

        .tags {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-size: 0.7em;
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>Who's Dirty?</h1>
    <div class="grid">
        {% for item in clothes %}
        <div class="clothing-item">
            <div class="tags">{{ item.id }}</div>
            <img src="/static/images/{{ item.image_path }}" alt="{{ item.id }}">
            <form method="post">
                <input type="hidden" name="selected_id" value="{{ item.id }}">
                <button type="submit">Dirty</button>
            </form>
        </div>
        {% endfor %}
        {% if not clothes %}
            <p>No remaining candidates!</p>
        {% endif %}
    </div>
    <div style="text-align:center; margin-top: 30px;">
    <form method="post" action="/laundry">
        <button type="submit" style="padding:10px 20px; font-size:1em; background-color:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">
            Do the Laundry
        </button>
    </form>
</div>
</body>
</html>
